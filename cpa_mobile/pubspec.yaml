name: cpa_mobile
description: "Chitranshu Pharmaceuticals Agency Mobile App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking
  dio: ^5.4.2
  
  # Routing
  go_router: ^13.2.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI & Utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
