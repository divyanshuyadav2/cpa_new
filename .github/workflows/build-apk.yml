name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'cpa_mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Get Dependencies
        working-directory: ./cpa_mobile
        run: flutter pub get

      - name: Build Android Release APK
        id: build_apk
        working-directory: ./cpa_mobile
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Print Build Output to Summary
        if: always()
        run: |
          echo "## 📋 Build Log (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 cpa_mobile/build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build_apk.outcome }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpa-release-apk
          path: cpa_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: app-latest
          name: "Chitranshu Pharma App (Latest Release)"
          body: |
            ### Chitranshu Pharma Mobile App - Android Release Build
            Automated build for latest updates:
            - Persistent shopping cart (retains items across restarts)
            - Strip vs Box pricing based on pack calculations
            - Frequently Ordered / Regular Items section on Catalog screen
            
            **Installation:** Download `app-release.apk` below and install on Android device.
          files: cpa_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
